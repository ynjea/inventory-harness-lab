name: 유지보수 작업
description: 에이전트가 작업을 시작하는 데 필요한 6개 항목을 채운다
title: "[작업] "
body:
  - type: markdown
    attributes:
      value: |
        이 Issue 는 **개별 유지보수 작업의 원본**이다 (`docs/harness/00-ssot.md §1`).
        여기 적힌 범위 안에서만 코드를 고치고, 범위를 넘겨야 하면 Issue 를 먼저 고친다.

        도메인·아키텍처 결정이 바뀌는 작업이면 Issue 가 아니라
        `docs/01-requirements.md` · `docs/06-architecture.md` 를 먼저 갱신한다 (`00-ssot.md §2`).
        이 Issue 와 SSOT 가 충돌하면 에이전트는 `NEEDS_HUMAN` 을 선언하고 판단을 요청한다 (`00-ssot.md §4`).

  - type: textarea
    id: background
    attributes:
      label: 1. 배경 — 왜 필요한가
      description: 지금 무엇이 문제이고, 고치지 않으면 무엇이 잘못되는가. 관련 문서·절 번호를 함께 적는다.
      placeholder: |
        예) 로트 소진 후에도 목록에 남아 FEFO 선택 후보로 잡힌다.
        근거: docs/01-requirements.md §3 F5-1
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 2. 변경할 내용 — 무엇을 수정하는가
      description: 바꿀 대상을 파일·함수 단위로 적는다. 방법이 아니라 대상과 결과를 적는다.
      placeholder: |
        예)
        - src/lib/fefo.ts — 잔량 0 로트를 후보에서 제외한다
        - src/app/products/[id]/page.tsx — 로트 목록에서 소진 로트를 기본으로 숨긴다
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 3. 종료 조건 — 무엇이 참이면 완료인가
      description: |
        종료 조건은 **실행해서 참·거짓을 확인할 수 있는 문장**으로 쓴다. 한 줄에 하나씩, 아래 세 가지가 문장에 드러나야 한다.

        - **기준** — 어떤 상태·입력에서 시작하는가 (거점, 로트, 유통기한, 기준일, 수량)
        - **수치** — 얼마나 바뀌는가 (몇 개, 어느 거점에서 어디로)
        - **기대 결과** — 무엇이 보이거나 저장되거나 거부되는가 (값, 오류, 화면에 표시되는 문구)

        읽은 사람마다 판정이 달라질 수 있는 말(정상, 정확히, 적절히, 잘, 빠르게)은 쓰지 않는다. 그 말이 뜻하는 수치나 결과로 바꿔 쓴다.

        ✅ 되는 예
        - 자사창고에 유통기한 2026-11-20 로트 6개가 있을 때(기준일 2026-11-24) 폐기를 확정하면 자사창고 -6, 폐기 +6이 되고 Movement 1건(사유 DISPOSE)이 생긴다.
        - 같은 폐기 전후로 모든 거점의 Lot.quantity 합계가 같다.
        - 잔량 7개인 로트에서 8개를 출고하면 InsufficientStockError가 나고 Lot·Movement는 하나도 바뀌지 않는다.
        - 성수 팝업에만 만료 로트가 있는 상품도 홈의 "만료" 필터 목록에 나온다.

        ❌ 안 되는 예
        - 폐기 기능이 정상적으로 동작한다. → 무엇이 "정상"인지 기준과 기대 결과가 없다
        - 조회 함수가 대상 로트를 정확히 반환한다. → 입력도, 기대하는 로트도 없다
        - 재고가 잘 맞는다. → 어느 거점의 어느 수치가 얼마여야 하는지 없다
        - 만료 표시를 개선한다. → 할 일이지 완료 조건이 아니다. 개선된 뒤 무엇이 보여야 하는지 쓴다
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 4. 기계 검증 — 어떤 테스트가 판정하는가
      description: |
        3번의 종료 조건을 판정하는 테스트를 정한다 (`docs/harness/02-verification.md §5`).

        - **파일**: 이 Issue 의 전용 테스트는 `tests/issues/issue-{Issue 번호}-{기능명}.test.ts` 하나에 만든다. 기능명은 영소문자와 하이픈으로 짧게 쓴다 — 예) `tests/issues/issue-21-expired-filter.test.ts`
        - **대응**: 종료 조건 한 줄마다 그것을 판정하는 테스트(`it`)를 하나 이상 둔다. 테스트 이름은 종료 조건 문장을 그대로 쓴다.
        - **대응이 안 되는 조건**: 화면 표시처럼 테스트로 판정할 수 없는 조건은 무엇으로 판정할지(수동 확인 절차와 기대 화면)를 여기에 먼저 적는다. 적지 않은 조건은 완료로 보지 않는다.
        - **실행**: 전용 테스트는 `npm run verify` 의 Test 단계에서 함께 돈다. 따로 돌린 결과는 판정이 아니다.
        - **완료**: `npm run verify` 가 통과하고, 3번의 모든 종료 조건이 아래 표의 테스트로 판정될 때 완료다.
      value: |
        - 공통: `npm run verify`
        - 전용 테스트 파일: `tests/issues/issue-{번호}-{기능명}.test.ts`

        | 종료 조건 (3번) | 판정하는 테스트 (`it` 이름) |
        |---|---|
        |  |  |
        |  |  |
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: 5. 건드리면 안 되는 것 — 변경 경계는 어디인가
      description: |
        이번 작업에서 손대지 않을 경로와 규칙을 적는다.
        보호 영역(`00-ssot.md §5`)은 읽기·실행만 하며, 바꿔야 하면 변경안을 내고 사람의 승인을 받는다.
      value: |
        - `docs/01-requirements.md` · `docs/06-architecture.md` — 읽기만 한다
        - `docs/harness/` · `AGENTS.md` · `CLAUDE.md` — 읽기만 한다
        - `scripts/verify/` — 실행만 한다
        - `tests/issues/` 의 다른 Issue 테스트와 `tests/` 최상위 기존 테스트 — 고치지 않는다
        - `applyMovement()` 외의 재고 수량 변경 통로를 새로 만들지 않는다 (`06 §4.1`)
        -
    validations:
      required: true

  - type: dropdown
    id: loop-limit
    attributes:
      label: 6. 구현 루프 최대 횟수 (기본값 3회)
      description: |
        AI 가 이 Issue 를 구현하면서 검증을 다시 시도할 수 있는 **상한**이다.

        - **1회 시도** = 이 Issue 범위 안의 구현 변경 + 그 변경에 대한 로컬 `npm run verify` 1회 실행. 결과가 통과든 실패든 1회로 센다.
        - **멈춤** — 정한 횟수를 다 쓰고도 `npm run verify` 를 통과하지 못하면 AI 는 더 반복하지 않는다. `NEEDS_HUMAN` 을 선언하고 사람에게 넘긴다 (`00-ssot.md §4`).
        - **넘길 때 보고** — 쓴 시도 횟수, 마지막으로 실패한 단계와 출력의 핵심 줄, 시도마다 바꾼 것, 사람이 답해야 할 질문 한 줄.
        - 사람의 판단을 받은 뒤 다시 시작할지, 횟수를 새로 셀지는 사람이 정한다.

        정하지 않으면 3회로 한다.
      options:
        - "1회"
        - "2회"
        - "3회"
        - "5회"
      default: 2
    validations:
      required: true
